<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` mean anything:
      without it every inset is 0, the shell's own safe-area padding is dead
      code, and an installed launch is letterboxed inside the safe area by the
      system instead of painting its own paper up to the edges.

      No `maximum-scale`, no `user-scalable=no`: pinch-zoom stays. A form that
      must not zoom the page under it is answered by 16px controls, which is
      the rule the modals already follow.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A quiet, local-first studio for your captures — view flight telemetry in sync with the frame, grade footage with LUTs, and more. Everything stays on your machine."
    />
    <title>Atelier — a studio for your captures</title>
    <!--
      Icons. Vite rewrites these `/…` hrefs with the build's base path, so they
      survive both the custom domain (base `/`) and a `/atelier/` preview.

      `rel="icon"` covers the browser tab and NOTHING else. iOS builds a
      home-screen icon from `apple-touch-icon` alone — a PNG, square, opaque —
      and with no such link it screenshots the page instead: that is what a
      "broken icon on iPhone" is, in Safari and in Chrome for iOS alike, since
      both are WebKit. The manifest is the Android/Chrome half; it carries no
      weight on iOS, which is why the touch icon is declared here and not left
      to it. `docs/memory/frontend.md` carries the whole rule.
    -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The paper the shell paints, so the system chrome matches it. There is
         one theme (`color-scheme: light` in src/index.css), so one value. It is
         declared here AND as the manifest's `theme_color`: a tab reads this
         one, an installed launch reads that one. -->
    <meta name="theme-color" content="#f4f0e7" />
    <!-- The theme, stamped before the first paint so a dark reader never sees
         a flash of paper. The same arithmetic as `shared/ui/theme.ts`:
         a stored `light`/`dark` wins, anything else follows the OS. -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('atelier.theme');
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#16130e');
        }
      })();
    </script>
    <!--
      Launched from the home screen, Atelier runs as its own app — the manifest
      says `display: "standalone"` and these two are the iOS half of it, which
      reads no manifest for this. Without them the status bar stays system
      white above the paper, which is the whole reason they are here.
      `default` is the light style: dark glyphs over the theme colour, the only
      one that suits ink on cream (`black-translucent` would put white glyphs
      on it and slide the page underneath).

      The cost, and it is real: iOS gives a home-screen app its own storage
      container, so trips and projects saved in Safari are not in it. Carry one
      over with a `.roadtrip.json` / `.atelier.json` export, or keep it on a
      Winnow. `docs/memory/frontend.md` carries the decision.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The name under the icon on a home screen; the title is a sentence. -->
    <meta name="apple-mobile-web-app-title" content="Atelier" />
    <meta name="application-name" content="Atelier" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
