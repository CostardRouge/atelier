# Every run parameter lives in a file like this one. To change something, copy
# it (e.g. configs/my-run.toml), edit the copy and pass it with
# `--config configs/my-run.toml`: only the keys you write replace these.
# A single key can also be changed on the command line: `--set ingest.long_edge=768`.
# Paths are relative to the training/ folder.

[paths]
data = "data"
fivek = "data/fivek"          # MIT-Adobe FiveK, as downloaded (never committed)
pairs = "data/pairs"          # your groups: one original + several edits each
synthetic = "data/synthetic"  # made by `atelier-train synth`, for trying everything without real data
cache = "data/cache"          # what `ingest` prepares for training
runs = "runs"                 # checkpoints, curves, exported .cube files (M2 on)

[device]
prefer = "auto"  # auto | mps | cuda | cpu

[ingest]
sources = ["fivek", "pairs"]  # add "synthetic" to train on the synthetic set
long_edge = 512               # pixels kept on the long edge of each prepared pair
fivek_expert = "C"            # A..E — C is the usual target in the literature
fivek_limit = 0               # 0 = every photo
# Which file to use as a FiveK INPUT when several exist for one photo (first found wins).
fivek_input_prefer = ["tif", "tiff", "png", "jpg", "jpeg", "dng"]
workers = 0                   # pairs prepared at once, in separate processes; 0 = automatic (half the cores, 1 to 8), 1 = no parallelism
aspect_tolerance = 0.01       # an edit whose aspect differs more is treated as cropped
align = "auto"                # auto: find a cropped/turned edit inside its original; always: search every pair; never: skip

[raw]
use_camera_wb = true
no_auto_bright = true

[synthetic]
groups = 12
size = [96, 64]       # width, height of each generated picture
edits_per_group = 3
fivek_photos = 8
seed = 7
style = ""            # one transform for EVERY edit ("teal-orange", "warm"…); empty = several at random per group

# ---- The model and its training (M2). ----
[model]
kind = "adaptive-3dlut"  # Zeng et al. 2020: a small CNN on a thumbnail weighs a few learned basis LUTs
lut_size = 33            # nodes per axis of every LUT (33 is what Atelier's looks use)
basis = 3                # learned basis LUTs (the first starts as the identity)
thumb = 256              # the thumbnail the CNN looks at, in pixels (square)
width = 16               # channels of the CNN's first layer; the rest doubles up to 8× this

[train]
name = ""                # a word for the run folder, runs/<date>-<name>; empty = the sources' names
epochs = 200
batch_size = 8           # the paper trains at 1; 8 to 16 is ~5× faster for a near-identical result
crop = 256               # training crop on the prepared pairs (the LUT applies to it; the CNN sees the thumbnail)
learning_rate = 2e-4
weight_decay = 0.0
smooth_weight = 1e-4     # keeps every LUT smooth between neighbouring nodes
monotonic_weight = 10.0  # keeps every LUT increasing along its own channel, so no tone reversal
val_fraction = 0.1       # groups held out for validation (split by GROUP, never by pair)
seed = 1
eval_every = 5           # epochs between two validations
keep_in_memory = true    # hold the prepared pairs in RAM after the first epoch (~2 MB a pair): the disk was 3× the GPU
skip_misaligned = true   # leave out of TRAINING a pair whose edit does not line up with its input (structure < 0.5)
subset = 0               # >0: train on this many pairs only, scored at every validation — the memorising test

# ---- The develop predictor (M6): the picture as shot → DevelopSettings' eleven sliders. ----
[develop]
name = ""                # a word for the run folder, runs/<date>-develop-<name>
thumb = 128              # the vignette is 256 px; the network looks at it at this size
width = 16               # channels of the first layer
hidden = 128             # the head's hidden width
epochs = 60
batch_size = 16
learning_rate = 3e-4
weight_decay = 1e-4
val_fraction = 0.15      # records held out, by picture id
eval_every = 2
seed = 1
