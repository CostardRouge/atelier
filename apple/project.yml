# The native app's Xcode project, GENERATED — never edit the .xcodeproj, edit
# this and run `xcodegen generate` (`brew install xcodegen`). The project file
# is gitignored: it is a build artefact of this spec, the way `dist/` is one of
# `vite build`, and merging two hand-edited pbxproj files is how a week gets
# lost. One spec, two targets, one source tree: iPhone/iPad and Mac are the
# same SwiftUI code under `#if os(...)` where the platform differs.
name: Atelier

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  AtelierKit:
    path: Packages/AtelierKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Atelier
    PRODUCT_BUNDLE_IDENTIFIER: website.steeve.atelier
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

targets:
  Atelier-iOS:
    type: application
    platform: iOS
    sources:
      - path: Atelier
        # A screen family's PARITY.md sits beside its views; an unknown
        # extension would be copied into the bundle as a resource, and two of
        # one name collide ("Multiple commands produce …/PARITY.md").
        excludes:
          - "**/*.md"
      # The place index a delivered picture's town is named from
      # (`delivery-place.ts`, the Export tab's Metadata): the web's own
      # committed GeoNames file, bundled as it stands rather than copied.
      - path: ../public/geo/cities.json
        buildPhase: resources
      # The LOOKS (`Atelier/Look/`): the built-in LUTs as the web ships them
      # (`public/luts/`, 37 MB, four families — bundled whole, the
      # coordinator's call), their pre-baked picker tiles
      # (`public/lut-thumbs/`, `scripts/gen-lut-thumbs.mjs`) and the log +
      # Rec.709 reference pair a pack look's tile is baked on
      # (`public/reference/`). FOLDER references, read at run time as
      # `Bundle.main.url(forResource: "luts", withExtension: nil)`: adding a
      # `.cube` under `public/luts/` needs no change here, as on the web.
      - path: ../public/luts
        type: folder
        buildPhase: resources
      - path: ../public/lut-thumbs
        type: folder
        buildPhase: resources
      - path: ../public/reference
        type: folder
        buildPhase: resources
      # The Live Activity's attributes (`Shared/ExportActivity.swift`):
      # compiled here, where `BackgroundRun` starts and feeds it, AND into
      # the widget extension that draws it.
      - path: Shared
    dependencies:
      - package: AtelierKit
      # The Live Activity's presentations, embedded in the app.
      - target: Atelier-Widgets
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Atelier
        CFBundleName: Atelier
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Atelier saves the pictures you export to your photo library.
        ITSAppUsesNonExemptEncryption: false
        # The links the app answers (`Atelier/App/AppLinks.swift`): the web's
        # hash routes under `atelier://` — `atelier://studio/open/<id>`,
        # `atelier://roadtrip/<trip>/<day>/<piece>`, `atelier://develop/<roll>`,
        # `atelier://connect?instance=…&return=…`, Winnow's timeline links.
        CFBundleURLTypes:
          - CFBundleURLName: website.steeve.atelier
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - atelier
        # An export keeps running when he leaves the app
        # (`Atelier/Tasks/BackgroundRun.swift`): on iOS 26 it becomes a
        # continued processing task under this ONE identifier, registered
        # at launch. [verify on device] whether continued processing needs
        # the `processing` mode — declared because a missing one would make
        # every request fail quietly, while a spare one costs nothing.
        BGTaskSchedulerPermittedIdentifiers:
          - website.steeve.atelier.export
        UIBackgroundModes:
          - processing
        # …and shows its progress in a Live Activity (`Atelier-Widgets`).
        NSSupportsLiveActivities: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The Core Image kernels (Atelier/Render/Kernels/*.metal) compile
        # into the app's default.metallib under these two flags, or they do
        # not load at all (`Render/Graph/Kernels.swift`).
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"

  # The Live Activity an export shows on the Lock Screen and in the Dynamic
  # Island while it runs (`Widgets/`, drawn from `Shared/ExportActivity.swift`):
  # an iOS-only WidgetKit extension embedded in Atelier-iOS. It links neither
  # the kernel nor the app — the app hands it the words ready-made — and has
  # no asset catalog, so the project's icon and accent names are cleared.
  Atelier-Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Support/Info-Widgets.plist
      properties:
        CFBundleDisplayName: Atelier
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # An extension's name and id are its own; its id must extend the app's.
        PRODUCT_NAME: AtelierWidgets
        PRODUCT_BUNDLE_IDENTIFIER: website.steeve.atelier.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

  Atelier-macOS:
    type: application
    platform: macOS
    sources:
      - path: Atelier
        # A screen family's PARITY.md sits beside its views; an unknown
        # extension would be copied into the bundle as a resource, and two of
        # one name collide ("Multiple commands produce …/PARITY.md").
        excludes:
          - "**/*.md"
      # The place index a delivered picture's town is named from
      # (`delivery-place.ts`, the Export tab's Metadata): the web's own
      # committed GeoNames file, bundled as it stands rather than copied.
      - path: ../public/geo/cities.json
        buildPhase: resources
      # The LOOKS (`Atelier/Look/`): the built-in LUTs as the web ships them
      # (`public/luts/`, 37 MB, four families — bundled whole, the
      # coordinator's call), their pre-baked picker tiles
      # (`public/lut-thumbs/`, `scripts/gen-lut-thumbs.mjs`) and the log +
      # Rec.709 reference pair a pack look's tile is baked on
      # (`public/reference/`). FOLDER references, read at run time as
      # `Bundle.main.url(forResource: "luts", withExtension: nil)`: adding a
      # `.cube` under `public/luts/` needs no change here, as on the web.
      - path: ../public/luts
        type: folder
        buildPhase: resources
      - path: ../public/lut-thumbs
        type: folder
        buildPhase: resources
      - path: ../public/reference
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtelierKit
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Atelier
        CFBundleName: Atelier
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryAddUsageDescription: Atelier saves the pictures you export to your photo library.
        ITSAppUsesNonExemptEncryption: false
        # The links the app answers (`Atelier/App/AppLinks.swift`): the web's
        # hash routes under `atelier://` — `atelier://studio/open/<id>`,
        # `atelier://roadtrip/<trip>/<day>/<piece>`, `atelier://develop/<roll>`,
        # `atelier://connect?instance=…&return=…`, Winnow's timeline links.
        CFBundleURLTypes:
          - CFBundleURLName: website.steeve.atelier
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - atelier
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Support/Atelier-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"
      configs:
        # `@testable import Atelier` from the gate needs the host built for
        # testing; Debug is what CI and Xcode run the tests in.
        Debug:
          ENABLE_TESTABILITY: YES

  # The render gate (AtelierTests/Render/*Tests.swift): every Core Image
  # kernel held to its pure twin in AtelierKit, the way the web's
  # `scripts/check-render.mjs` holds the GLSL. Hosted by the Mac app because
  # the kernels live in its default.metallib; run by `xcodebuild test -scheme
  # Atelier-macOS`, which CI's app job does.
  AtelierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AtelierTests
    dependencies:
      - target: Atelier-macOS
      - package: AtelierKit
    info:
      path: Support/Info-AtelierTests.plist
      properties:
        CFBundleName: AtelierTests
    settings:
      base:
        # The project's product name and bundle id are the app's; a test
        # bundle wearing them would collide with its own host.
        PRODUCT_NAME: AtelierTests
        PRODUCT_BUNDLE_IDENTIFIER: website.steeve.atelier.tests
        # Hosted: the gate runs INSIDE the Mac app, whose bundle holds the
        # metallib `Kernels` loads. Said outright rather than left to the
        # generator's inference from the dependency above.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atelier.app/Contents/MacOS/Atelier"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Atelier-iOS:
    build:
      targets:
        Atelier-iOS: all
    run:
      config: Debug
  Atelier-macOS:
    build:
      targets:
        Atelier-macOS: all
        AtelierTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtelierTests
