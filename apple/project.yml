# The native app's Xcode project, GENERATED — never edit the .xcodeproj, edit
# this and run `xcodegen generate` (`brew install xcodegen`). The project file
# is gitignored: it is a build artefact of this spec, the way `dist/` is one of
# `vite build`, and merging two hand-edited pbxproj files is how a week gets
# lost. One spec, two targets, one source tree: iPhone/iPad and Mac are the
# same SwiftUI code under `#if os(...)` where the platform differs.
name: Atelier

options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  AtelierKit:
    path: Packages/AtelierKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Atelier
    PRODUCT_BUNDLE_IDENTIFIER: website.steeve.atelier
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

targets:
  Atelier-iOS:
    type: application
    platform: iOS
    sources:
      - path: Atelier
        # A screen family's PARITY.md sits beside its views; an unknown
        # extension would be copied into the bundle as a resource, and two of
        # one name collide ("Multiple commands produce …/PARITY.md").
        excludes:
          - "**/*.md"
      # The place index a delivered picture's town is named from
      # (`delivery-place.ts`, the Export tab's Metadata): the web's own
      # committed GeoNames file, bundled as it stands rather than copied.
      - path: ../public/geo/cities.json
        buildPhase: resources
      # The built-in looks: ONE folder reference to the web's own
      # `public/luts/`, never a copy under `apple/` — the bundle carries the
      # folder once, as `luts/` (~37 MB, the same files the site serves), and
      # a `.cube` added there reaches the app with no code change, as it
      # reaches the site (`Develop/Render/DevelopLooks.swift` scans it).
      - path: ../public/luts
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtelierKit
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Atelier
        CFBundleName: Atelier
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Atelier saves the pictures you export to your photo library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # The Core Image kernels (Atelier/Render/Kernels/*.metal) compile
        # into the app's default.metallib under these two flags, or they do
        # not load at all (`Render/Graph/Kernels.swift`).
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"

  Atelier-macOS:
    type: application
    platform: macOS
    sources:
      - path: Atelier
        # A screen family's PARITY.md sits beside its views; an unknown
        # extension would be copied into the bundle as a resource, and two of
        # one name collide ("Multiple commands produce …/PARITY.md").
        excludes:
          - "**/*.md"
      # The place index a delivered picture's town is named from
      # (`delivery-place.ts`, the Export tab's Metadata): the web's own
      # committed GeoNames file, bundled as it stands rather than copied.
      - path: ../public/geo/cities.json
        buildPhase: resources
      # The built-in looks, as on iOS: one folder reference, carried once.
      - path: ../public/luts
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtelierKit
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Atelier
        CFBundleName: Atelier
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryAddUsageDescription: Atelier saves the pictures you export to your photo library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Support/Atelier-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MTL_COMPILER_FLAGS: "-fcikernel"
        MTLLINKER_FLAGS: "-fcikernel"
      configs:
        # `@testable import Atelier` from the gate needs the host built for
        # testing; Debug is what CI and Xcode run the tests in.
        Debug:
          ENABLE_TESTABILITY: YES

  # The render gate (AtelierTests/Render/*Tests.swift): every Core Image
  # kernel held to its pure twin in AtelierKit, the way the web's
  # `scripts/check-render.mjs` holds the GLSL. Hosted by the Mac app because
  # the kernels live in its default.metallib; run by `xcodebuild test -scheme
  # Atelier-macOS`, which CI's app job does.
  AtelierTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AtelierTests
    dependencies:
      - target: Atelier-macOS
      - package: AtelierKit
    info:
      path: Support/Info-AtelierTests.plist
      properties:
        CFBundleName: AtelierTests
    settings:
      base:
        # The project's product name and bundle id are the app's; a test
        # bundle wearing them would collide with its own host.
        PRODUCT_NAME: AtelierTests
        PRODUCT_BUNDLE_IDENTIFIER: website.steeve.atelier.tests
        # Hosted: the gate runs INSIDE the Mac app, whose bundle holds the
        # metallib `Kernels` loads. Said outright rather than left to the
        # generator's inference from the dependency above.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atelier.app/Contents/MacOS/Atelier"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Atelier-iOS:
    build:
      targets:
        Atelier-iOS: all
    run:
      config: Debug
  Atelier-macOS:
    build:
      targets:
        Atelier-macOS: all
        AtelierTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtelierTests
